<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Ôn thi 80 câu Big Data với 4 lựa chọn và chế độ ôn câu sai.">
  <title>Big Data 80 — Luyện trắc nghiệm</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900;1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <a href="#" class="brand" id="homeLink">Big Data<span>80</span></a>
    <button class="small-btn" id="resetBtn" title="Xóa lịch sử học">Đặt lại</button>
  </header>
  <main id="home" class="home">
    <section class="welcome">
      <h1>Luyện tập <span class="highlight">Big Data</span><br>80 câu trắc nghiệm.</h1>
      <p>Đủ 4 đáp án như lúc thi. Làm sai câu nào, ôn lại câu đó.</p>
    </section>
    <section class="home-actions" aria-label="Chế độ ôn tập">
      <button id="quizMode" class="mode-card primary-card">
        <strong>Làm trắc nghiệm <span aria-hidden="true">→</span></strong>
        <small>Luyện 10, 20, 40 hoặc 80 câu</small>
      </button>
      <button id="wrongMode" class="mode-card wrong-card">
        <strong>Ôn lại câu sai <span aria-hidden="true">→</span></strong>
        <small><span id="wrongCount">0</span> câu cần ôn</small>
      </button>
    </section>
    <p class="home-progress">Đã trả lời đúng <strong id="correctCount">0</strong>/80 câu</p>
  </main>
  <section id="setup" class="setup hidden" aria-label="Chọn bộ đề">
    <button class="back" id="setupBack">← Quay lại</button>
    <h2>Chọn số câu<br><span>muốn luyện.</span></h2>
    <div class="count-grid" id="countGrid">
      <button class="count-choice active" data-count="10">10 <span>câu</span></button>
      <button class="count-choice" data-count="20">20 <span>câu</span></button>
      <button class="count-choice" data-count="40">40 <span>câu</span></button>
      <button class="count-choice" data-count="80">80 <span>câu</span></button>
    </div>
    <label class="toggle-line"><span>Trộn thứ tự câu hỏi</span><input type="checkbox" id="shuffle" checked></label>
    <button id="startQuiz" class="main-btn">Bắt đầu ngay <span aria-hidden="true">→</span></button>
  </section>
  <section id="exam" class="exam hidden" aria-live="polite">
    <div class="exam-top"><button class="back" id="examExit">← Thoát</button><span class="exam-mode" id="examMode">LÀM TRẮC NGHIỆM</span></div>
    <div class="progress-info"><strong id="progressLabel">Câu 1 / 10</strong><span id="scoreLabel">0 đúng</span></div>
    <div class="progress-track"><span id="progressFill"></span></div>
    <div id="questionArea"></div>
    <div id="examActions" class="exam-actions"></div>
  </section>
  <section id="result" class="result hidden">
    <p class="result-label">HOÀN THÀNH</p>
    <h2 id="resultTitle">Xong rồi!</h2>
    <div class="result-score" id="resultScore">0/10</div>
    <p id="resultMessage"></p>
    <div class="result-buttons">
      <button class="main-btn" id="resultWrong">Ôn lại câu sai →</button>
      <button class="outline-btn" id="resultAgain">Làm trắc nghiệm tiếp</button>
      <button class="text-btn" id="resultHome">Về trang chủ</button>
    </div>
  </section>
</div>
<script src="questions.js"></script><script src="app.js"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body>
</html>
